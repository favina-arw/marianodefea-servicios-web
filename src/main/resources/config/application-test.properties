# --- SERVIDOR TEST/STAGING ---
server.port=8081

# --- BASE DE DATOS TEST (El clon de prod) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/mariano_defea_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# ¡CRÍTICO! Hibernate solo mira, no toca.
spring.jpa.hibernate.ddl-auto=validate

# --- FLYWAY ---
spring.flyway.enabled=true
# baseline-on-migrate en true por si esta base viene de antes de que usaras Flyway
spring.flyway.baseline-on-migrate=true 

# --- LOGS ---
# Acá sí prendemos el SQL para ver exactamente qué hace Flyway al migrar
spring.jpa.show-sql=true