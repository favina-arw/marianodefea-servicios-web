<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <title>Tipos de Cargo</title>
</head>
<body>
<main layout:fragment="dashboard_content">

    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
            <div th:replace="~{fragments/components :: action_card(
            url='/admin/cargo_tipos/crear',
            iconClass='bi bi-plus-lg me-1',
            title='Nuevo Tipo',
            subtitle='Crear nuevo tipo de cargo')}">
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h6 class="card-title fw-bold text-uppercase mb-3">Lista de Tipos de Cargo</h6>
            <hr>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0" style="font-size: 0.9rem;">
                    <thead>
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>NOMBRE</th>
                        <th>DESCRIPCIÓN</th>
                        <th class="text-center">ESTADO</th>
                        <th class="text-center pe-3">ACCIONES</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tipo : ${tipos}">
                        <td class="ps-3 text-muted" th:text="${tipo.id}"></td>
                        <td class="fw-semibold" th:text="${tipo.nombre}"></td>
                        <td th:text="${tipo.descripcion}"></td>
                        <td class="text-center">
                            <span th:if="${tipo.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${tipo.activo}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td class="text-center pe-3">
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/admin/cargo-tipos/editar/{id}(id=${tipo.id})}" class="btn btn-sm btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:if="${tipo.activo}" th:href="@{/admin/cargo-tipos/baja/{id}(id=${tipo.id})}" class="btn btn-sm btn-danger">
                                    <i class="bi bi-dash-circle"></i>
                                </a>
                                <a th:unless="${tipo.activo}" th:href="@{/admin/cargo-tipos/alta/{id}(id=${tipo.id})}" class="btn btn-sm btn-success">
                                    <i class="bi bi-check-circle"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
