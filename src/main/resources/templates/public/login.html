<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{public/base}"> <!-- Heredamos del layout principal -->
<head>
    <title>Login - Gestión Escolar</title>

    <th:block layout:fragment="estilos_adicionales">
        <!-- Si tenés algo específico para el login en tu styles.css, lo llamamos acá -->
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </th:block>
</head>
<body>

<!-- Todo este bloque se inyecta en el 'content' del base.html -->
<div layout:fragment="content" class="d-flex justify-content-center align-items-center vh-100">

    <!-- Reemplazamos el 'bg-white' por nuestra clase 'card' que soporta modo oscuro -->
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4 p-md-5">

            <!-- Encabezado con el ícono corporativo que venimos usando -->
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">Iniciar Sesión</h3>
                <p class="text-muted small">Colegio N° 795</p>
            </div>

            <!-- El formulario -->
            <form th:action="@{/login}" method="POST">

                <div class="mb-3">
                    <label for="username" class="form-label text-muted fw-medium small">Usuario</label>
                    <!-- Le agregué un input-group para ponerle un iconito al lado, queda muy pro -->
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-muted fw-medium small">Contraseña</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" required>
                    </div>
                </div>

                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                        <label class="form-check-label small text-muted" for="rememberMe">Recordarme</label>
                    </div>
                    <a href="#" class="text-decoration-none small">¿Olvidaste tu clave?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                    Entrar
                </button>

            </form>

            <p class="text-center mt-4 mb-0 small text-muted">
                ¿No tienes una cuenta? <a th:href="@{/register}" class="text-decoration-none fw-semibold">Regístrate!</a>
            </p>
        </div>
    </div>

</div>

</body>
</html>
