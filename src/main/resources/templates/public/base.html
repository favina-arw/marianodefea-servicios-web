<!DOCTYPE html>
<html lang="es" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Gestión Escolar</title>

    <!-- 1. Bootstrap 5, Bootstrap Icons y jQuery vía WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">

    <!-- Toastify CSS (Lo dejo por CDN a menos que lo hayas descargado) -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <script>
        // Script preventivo para el modo oscuro
        const getStoredTheme = () => localStorage.getItem('theme')
        const setTheme = theme => {
            if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-bs-theme', 'dark')
            } else {
                document.documentElement.setAttribute('data-bs-theme', theme || 'light')
            }
        }
        setTheme(getStoredTheme())
    </script>

    <style>
        button, .btn, input[type="submit"] { text-transform: uppercase; letter-spacing: 1px; }
        body { min-height: 100vh; background-color: var(--bs-body-bg); color: var(--bs-body-color); transition: background-color 0.3s, color 0.3s; }
        .main-content { transition: margin-left 0.3s ease; padding-top: 60px; }

        [data-bs-theme="light"] {
            --bs-body-bg: #f4f7f6;
            --bs-surface-color: #ffffff;
        }

        [data-bs-theme="dark"] {
            --bs-body-bg: #0f111a;
            --bs-tertiary-bg: #1a1d29;
            --bs-surface-color: #1e2230;
        }

        .card {
            background-color: var(--bs-surface-color) !important;
            border: 1px solid var(--bs-border-color-translucent);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        [data-bs-theme="dark"] .card:hover { border-color: rgba(255, 255, 255, 0.2); }

        /* Animación para las tarjetas de acción */
        .action-card-link .action-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border: 1px solid var(--bs-border-color-translucent) !important;
        }

        .action-card-link:hover .action-card {
            transform: translateY(-3px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.08) !important;
            border-color: var(--bs-primary) !important;
        }

        [data-bs-theme="dark"] .action-card-link:hover .action-card {
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.2) !important;
        }

        .hover-primary:hover {
            color: var(--bs-primary) !important;
            transition: color 0.2s ease-in-out;
        }
    </style>

    <th:block layout:fragment="estilos_adicionales"></th:block>
</head>
<body>

<div layout:fragment="content"></div>

<!-- Scripts Globales vía WebJars -->
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script th:inline="javascript">
    function lanzarToast(mensaje, tipo = 'success') {
        let colorBackground;
        switch(tipo) {
            case 'error':
            case 'danger':
                colorBackground = "#ff5f6d";
                break;
            case 'warning':
                colorBackground = "#f39c12";
                break;
            case 'out': // Sumamos el color para 'out' (Salida)
                colorBackground = "#f89b29";
                break;
            case 'info':
            case 'in': // Sumamos el color para 'in' (Entrada)
                colorBackground = "#2193b0";
                break;
            default: // success
                colorBackground = "#11998e";
        }

        Toastify({
            text: mensaje.toUpperCase(),
            duration: 4000,
            close: true,
            gravity: "top",
            position: "right",
            stopOnFocus: true,
            offset: {
                x: 0,  // Margen horizontal
                y: 45  // Margen vertical (Aumentá este número si querés que baje más)
            },
            style: {
                background: colorBackground,
                borderRadius: "10px",
                fontWeight: "600",
                fontSize: "13px",
                boxShadow: "0 4px 12px rgba(0,0,0,0.15)"
            },
        }).showToast();
    }

    // Interceptor de mensajes de Spring Boot Model
    document.addEventListener('DOMContentLoaded', function() {
        // Obtenemos TODAS las posibles variables del modelo
        var successMsg = /*[[${success}]]*/ null;
        var errorMsg = /*[[${error}]]*/ null;
        var infoMsg = /*[[${info}]]*/ null;
        var warningMsg = /*[[${warning}]]*/ null;

        // Sumamos las del controlador de fichadas
        var inMsg = /*[[${in}]]*/ null;
        var outMsg = /*[[${out}]]*/ null;

        // Disparamos los Toast según lo que haya llegado
        if (successMsg) lanzarToast(successMsg, 'success');
        if (errorMsg) lanzarToast(errorMsg, 'error');
        if (infoMsg) lanzarToast(infoMsg, 'info');
        if (warningMsg) lanzarToast(warningMsg, 'warning');

        // Disparamos las fichadas
        if (inMsg) lanzarToast(inMsg, 'in');
        if (outMsg) lanzarToast(outMsg, 'out');

        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>
<div th:replace="~{fragments/toast :: toast_global}"></div>
<th:block layout:fragment="scripts_adicionales"></th:block>
</body>
</html>
