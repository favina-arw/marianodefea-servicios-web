<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{public/base}">
<head>
    <th:block layout:fragment="estilos_adicionales">
        <style>
            :root {
                --sidebar-width: 220px;
                --sidebar-collapsed-width: 50px;
                --transition-speed: 0.25s;
            }

            #sidebar-wrapper {
                width: var(--sidebar-collapsed-width);
                height: 100vh;
                position: fixed;
                top: 0; left: 0; z-index: 1000;
                transition: width 0.3s ease;
                background-color: var(--bs-tertiary-bg);
                overflow-x: hidden;
            }

            body.sidebar-expanded #sidebar-wrapper { width: var(--sidebar-width); }

            .main-content {
                margin-left: var(--sidebar-collapsed-width);
                transition: margin-left 0.3s ease;
                padding-top: 48px;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            main { flex: 1; }
            body.sidebar-expanded .main-content { margin-left: var(--sidebar-width); }

            .list-group-item {
                display: flex; align-items: center; white-space: nowrap;
                border: none !important;
                padding: 0.5rem 0 !important;
                transition: all 0.2s ease; border-left: 3px solid transparent !important;
                font-size: 0.9rem;
            }

            .list-group-item:hover {
                background-color: var(--bs-secondary-bg) !important;
                border-left: 3px solid var(--bs-primary) !important;
                color: var(--bs-primary) !important;
            }

            .list-group-item i {
                min-width: calc(var(--sidebar-collapsed-width) - 3px);
                text-align: center;
                font-size: 1.1rem;
            }

            .menu-text { opacity: 0; transition: opacity 0.2s ease; font-weight: 500; margin-left: 10px; }
            body.sidebar-expanded .menu-text { opacity: 1; }
            #sidebar-wrapper::-webkit-scrollbar { display: none; }

            @media (max-width: 767px) {
                #sidebar-wrapper { margin-left: calc(var(--sidebar-collapsed-width) * -1); }
                body.sidebar-expanded #sidebar-wrapper { margin-left: 0; width: var(--sidebar-width); }
                .main-content { margin-left: 0 !important; }
            }

            .footer { border-top: 1px solid rgba(0, 0, 0, 0.05) !important; }
            [data-bs-theme="dark"] .footer { border-top: 1px solid rgba(255, 255, 255, 0.07) !important; }
        </style>
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="p-3">
            <div layout:fragment="app_content"></div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script>
        // TEMAS CLARO/OSCURO
        const menuToggle = document.getElementById("menu-toggle");
        const body = document.body;

        if (localStorage.getItem('sidebar-state') === 'expanded') {
            body.classList.add("sidebar-expanded");
        }

        menuToggle.addEventListener("click", () => {
            body.classList.toggle("sidebar-expanded");
            localStorage.setItem('sidebar-state', body.classList.contains("sidebar-expanded") ? 'expanded' : 'collapsed');
        });

        const themeBtn = document.getElementById('theme-btn');
        const iconLight = document.getElementById('theme-icon-light');
        const iconDark = document.getElementById('theme-icon-dark');

        const updateIcons = (theme) => {
            if (theme === 'dark') {
                iconLight.classList.remove('d-none');
                iconDark.classList.add('d-none');
            } else {
                iconLight.classList.add('d-none');
                iconDark.classList.remove('d-none');
            }
        }

        updateIcons(document.documentElement.getAttribute('data-bs-theme'));

        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcons(newTheme);
        });

        // CONFIGURACIÓN PARA INPUTS TIPO HORA
        document.addEventListener('DOMContentLoaded', function() {
            flatpickr(".reloj-24h", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i",
                time_24hr: true,
                locale: "es",
                minuteIncrement: 5
            });
        });

        // PREVISUALIZACIÓN DE ARCHIVOS
        function previsualizarArchivo(input, campo) {
            const container = document.getElementById('container_preview_' + campo);
            const imgPreview = document.getElementById('img_preview_' + campo);
            const pdfPreview = document.getElementById('pdf_preview_' + campo);
            const infoPreview = document.getElementById('info_preview_' + campo);

            if (input.files && input.files[0]) {
                const file = input.files[0];
                const fileType = file.type;
                const fileURL = URL.createObjectURL(file);

                imgPreview.classList.add('d-none');
                pdfPreview.classList.add('d-none');
                infoPreview.classList.add('d-none');
                container.classList.remove('d-none');

                if (fileType.startsWith('image/')) {
                    imgPreview.src = fileURL;
                    imgPreview.classList.remove('d-none');
                } else if (fileType === 'application/pdf') {
                    pdfPreview.src = fileURL;
                    pdfPreview.classList.remove('d-none');
                } else {
                    const spanText = infoPreview.querySelector('span');
                    spanText.innerText = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    infoPreview.classList.remove('d-none');
                }
            } else {
                container.classList.add('d-none');
            }
        }

        function limpiarArchivo(campo) {
            const input = document.getElementById('id_' + campo);
            const container = document.getElementById('container_preview_' + campo);
            if (input) {
                input.value = '';
                container.classList.add('d-none');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            $('.select2-busqueda').select2({
                theme: 'bootstrap-5',
                language: 'es',
                width: '100%',
                placeholder: "Buscar y seleccionar..."
            });
        });
    </script>
</div>
</body>
</html>
