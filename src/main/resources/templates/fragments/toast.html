<div th:fragment="toast(message, type)" th:if="${message != null}"
     class="toast-container position-fixed top-0 end-0 p-3">

    <div id="liveToast" class="toast align-items-center text-white border-0"
         th:classappend="${
            type == 'error' ? 'bg-danger' :
            (type == 'success' ? 'bg-success' :
            (type == 'info' ? 'bg-info text-dark' :
            (type == 'primary' || type == 'in' ? 'bg-primary' :
            (type == 'warning' || type == 'out' ? 'bg-warning text-dark' : 'bg-secondary'))))
         }"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" th:text="${message}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toastEl = document.getElementById('liveToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 6000 });
            toast.show();
        });
    </script>
</div>
