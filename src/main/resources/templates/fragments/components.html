<!-- templates/fragments/components.html -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TARJETA DE ACCIÓN MINIMALISTA -->
<div th:fragment="action_card(url, iconClass, title, subtitle)">
    <a th:href="${url}" class="text-decoration-none action-card-link">
        <div class="card border-0 shadow-sm h-100 action-card" style="border-radius: 0.75rem; background-color: var(--bs-surface-color);">
            <div class="card-body d-flex align-items-center p-3">

                <!-- Contenedor del ícono (Usa colores "subtle" que se adaptan solos al modo oscuro) -->
                <div class="rounded-3 d-flex align-items-center justify-content-center bg-primary-subtle text-primary me-3" style="width: 48px; height: 48px;">
                    <i th:class="${iconClass} + ' fs-4'"></i>
                </div>

                <!-- Textos -->
                <div>
                    <h6 class="mb-0 fw-bold text-uppercase text-body" th:text="${title}">Título</h6>
                    <small class="text-muted" style="font-size: 0.8rem;" th:if="${subtitle != null}" th:text="${subtitle}">Subtítulo</small>
                </div>

            </div>
        </div>
    </a>
</div>

</body>
</html>
