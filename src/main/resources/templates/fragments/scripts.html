<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="scripts">

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // --- 1. LÓGICA DEL SIDEBAR ---
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggle-sidebar');
            const labels = document.querySelectorAll('.menu-label');

            if (sidebar && toggleBtn) {
                const isExpanded = localStorage.getItem('sidebarExpanded') === 'true';

                const applySidebarState = (expand) => {
                    if (expand) {
                        sidebar.style.width = '250px';
                        labels.forEach(l => l.classList.remove('d-none'));
                    } else {
                        sidebar.style.width = '80px';
                        labels.forEach(l => l.classList.add('d-none'));
                    }
                };

                applySidebarState(isExpanded);

                toggleBtn.addEventListener('click', () => {
                    const currentlyExpanded = sidebar.style.width === '250px';
                    applySidebarState(!currentlyExpanded);
                    localStorage.setItem('sidebarExpanded', !currentlyExpanded);
                });
            }

            // --- 2. LÓGICA DEL MODO OSCURO ---
            const btnSwitchTheme = document.getElementById('btnSwitchTheme');

            if (btnSwitchTheme) {
                btnSwitchTheme.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-bs-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                    // Cambia el atributo en el HTML inmediatamente
                    document.documentElement.setAttribute('data-bs-theme', newTheme);
                    // Guarda la preferencia en el navegador
                    localStorage.setItem('theme', newTheme);
                });
            }
        });
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- DataTables Core -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <!-- DataTables Bootstrap 5 Integration -->
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

</th:block>
</body>
</html>
