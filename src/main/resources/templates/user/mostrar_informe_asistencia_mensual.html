<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
    <head>
        <title>Informe de Asistencia Mensual</title>
    </head>

    <body>
        <main layout:fragment="dashboard_content">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex flex-column flex-xl-row justify-content-between align-items-xl-center mb-0 gap-3">

                        <!-- Título principal -->
                        <div>
                            <h5 class="mb-0 fw-bold text-body text-uppercase d-flex align-items-center">
                                <i class="bi bi-journal-check text-primary me-2"></i>
                                Informe de Asistencia
                            </h5>
                            <!-- Subtítulo con el mes -->
                            <span class="text-muted text-uppercase small fw-medium" th:text="${#strings.capitalize(#temporals.format(diasHabiles[0], 'MMMM yyyy'))}">
                                Mes y Año
                            </span>
                        </div>

                        <!-- Barra de herramientas (Filtros y Exportación) -->
                        <div class="d-flex flex-column flex-md-row gap-3">

                            <!-- Formulario de Selección de Mes -->
                            <form onsubmit="return redirectToMes()" class="m-0">
                                <!-- AGREGADO: flex-nowrap para blindar el grupo -->
                                <div class="input-group shadow-sm flex-nowrap">
                                    <span class="input-group-text bg-body-tertiary text-muted border-end-0" title="Seleccionar mes">
                                        <i class="bi bi-calendar3"></i>
                                    </span>
                                    <!-- Achiqué un poquito el min-width para que sea más flexible -->
                                    <select id="mes" name="mes" class="form-select border-start-0 ps-0" style="min-width: 100px;">
                                        <option value="" disabled selected>Mes...</option>
                                        <option th:each="i : ${#numbers.sequence(1, 12)}"
                                                th:value="${i}"
                                                th:text="${i}">1</option>
                                    </select>
                                    <!-- AGREGADO: text-nowrap para que la palabra no se parta -->
                                    <button type="submit" class="btn btn-primary fw-semibold px-3 text-nowrap">
                                        Actualizar
                                    </button>
                                </div>
                            </form>

                            <!-- Controles de Exportación PDF -->
                            <!-- AGREGADO: flex-nowrap -->
                            <div class="input-group shadow-sm flex-nowrap">
                                <span class="input-group-text bg-body-tertiary border-end-0" title="Formato de página">
                                    <i class="bi bi-file-earmark-pdf-fill text-danger"></i>
                                </span>
                                <select id="formato" class="form-select border-start-0 ps-0" style="min-width: 100px;">
                                    <option value="a4">Hoja A4</option>
                                    <option value="legal">Hoja Oficio</option>
                                </select>
                                <!-- AGREGADO: text-nowrap -->
                                <button class="btn btn-danger fw-semibold px-3 text-nowrap" type="button" onclick="exportarTablaPDF()">
                                    Exportar
                                </button>
                            </div>

                        </div>
                    </div>

                    <hr>
                    <div class="table-responsive" style="display: block; white-space: nowrap;">
                        <table id="tabla_informe" class="table table-striped";>
                            <thead>
                            <tr>
                                <th>Agente</th>
                                <th th:each="dia : ${diasHabiles}"
                                    th:text="${#temporals.format(dia, 'dd/MM')}">
                                    Día
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="registro : ${informe}" th:with="agente=${registro.agente}">
                                <td th:text="${agente.apellido?.toUpperCase() + ', ' + agente.nombre?.toUpperCase()}">
                                    Nombre Agente
                                </td>
                                <td th:each="dia : ${diasHabiles}">
                                    <!-- Versión segura con manejo de nulos -->
                                    <span class="align-items-center" style="display: block; text-align: center;"  th:utext="${registro.getAsistenciaPorDia(dia).orElse(null)?.estado ?: 'A<br/>S/D'}"></span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <hr class="mt-4 mb-3 border-secondary opacity-25">

                    <h6 class="fw-bold text-uppercase mb-3">
                        <i class="bi bi-exclamation-circle text-warning me-2"></i> Anexo de Novedades e Irregularidades
                    </h6>

                    <div class="row">
                        <div class="col-12">
                            <div class="list-group list-group-flush border rounded shadow-sm">
                                <div th:each="registro : ${informe}" th:if="${registro.tieneAnomalias()}" class="list-group-item bg-transparent py-3">
                                    <div class="d-flex w-100 justify-content-between align-items-center mb-2">
                                        <h6 class="mb-0 fw-bold text-primary">
                                            <i class="bi bi-person me-1"></i>
                                            <span th:text="${registro.agente.apellido.toUpperCase() + ', ' + registro.agente.nombre}"></span>
                                        </h6>
                                        <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill">
                                            <span th:text="${registro.anomalias.size()}"></span> anomalía/s
                                        </span>
                                    </div>
                                    <ul class="mb-0 list-unstyled ps-4 border-start border-2 border-warning ms-2 pe-1">
                                        <li th:each="anomalia : ${registro.anomalias}" class="mb-1 small">
                                            <span class="fw-semibold me-2" th:text="${#temporals.format(anomalia.fecha, 'dd/MM/yyyy')} + ':'"></span>
                                            <span th:text="${anomalia.observacion}"></span>
                                        </li>
                                    </ul>
                                </div>

                                <div th:if="${#lists.isEmpty(informe.?[tieneAnomalias()])}" class="list-group-item bg-transparent py-4 text-center fst-italic">
                                    <i class="bi bi-check-circle fs-4 text-success d-block mb-2"></i>
                                    No se registraron llegadas tarde ni salidas anticipadas en este período.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Botón para volver al listado -->
            <div class="card mt-5">
                <div class="card-body d-flex justify-content-center">
                    <a th:href="@{/fichada/listarFichadas}" class="btn btn-sm btn-primary">
                        Volver
                    </a>
                </div>
            </div>


            <script>
                // Selecciona el mes actual al cargar
                window.addEventListener("DOMContentLoaded", function () {
                    const mesActual = new Date().getMonth() + 1;
                    document.getElementById("mes").value = mesActual;
                });

                function redirectToMes() {
                    const mes = document.getElementById("mes").value;
                    if (mes) {
                        window.location.href = `/fichada/informeAsistenciaMensual/${mes}`;
                    }
                    return false; // evitar envío tradicional del formulario
                }
            </script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
            <script>
                function exportarTablaPDF() {
                    const { jsPDF } = window.jspdf;

                    const formato = document.getElementById("formato").value; // a4 o legal

                    const titulo = "Informe de Asistencia";
                    const nombreArchivo = "informe_asistencia.pdf";

                    const doc = new jsPDF({
                        orientation: "landscape",
                        unit: "mm",
                        format: formato,
                    });

                    doc.setFontSize(14);
                    doc.text(titulo, 14, 15);

                    doc.autoTable({
                        html: "#tabla_informe",
                        startY: 20,
                        theme: "striped",
                        styles: {
                            fontSize: 8,
                            cellPadding: 2,
                        },
                        headStyles: {
                            fillColor: [41, 128, 185],
                            textColor: 255,
                        },
                    });

                    doc.save(nombreArchivo);
                }
            </script>
        </main>
    </body>
</html>
