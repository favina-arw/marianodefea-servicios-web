<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">

  <head>
    <title>Listado de Fichadas</title>
  </head>

  <body>
    <main layout:fragment="dashboard_content">

      <div class="row g-3 mb-4">
        <!-- Tarjeta: Agregar Agente -->
        <div class="col-3 col-sm-6 col-xl-3">
          <div th:replace="~{fragments/components :: action_card(
            url='/fichada/informeAsistenciaMensual',
            iconClass='bi bi-calendar3',
            title='Asistencia mensual',
            subtitle='Informe de asistencias')}">
          </div>
        </div>

        <div class="col-3 col-sm-6 col-xl-3">
          <div th:replace="~{fragments/components :: action_card(
          url='/fichada/crearTipoFichada',
          iconClass='bi bi-box-arrow-in-right',
          title='Crear Tipo de Fichada',
          subtitle='Crear nuevo tipo de fichada')}">
          </div>
        </div>

      </div>


      <div class="card shadow-sm">
        <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
          <h6 class="mb-0 fw-bold text-body text-uppercase">
            Listado de Fichadas
          </h6>
          <hr class="mt-3 mb-0 text-muted opacity-25">
        </div>
        <div class="card-body p-4">

          <div class="p-3 rounded-3 mb-4 border">
            <form method="get" class="mb-0">
              <div class="row g-2 align-items-end">

                <div class="col-12 col-md-2">
                  <label for="nombreInput" class="form-label small fw-bold mb-1">Nombre</label>
                  <input type="text" id="nombreInput" name="nombre" placeholder="Ej: Mariano" th:value="${nombre}" class="form-control form-control-sm">
                </div>

                <div class="col-12 col-md-2">
                  <label for="apellidoInput" class="form-label small fw-bold mb-1">Apellido</label>
                  <input type="text" id="apellidoInput" name="apellido" placeholder="Ej: Defea" th:value="${apellido}" class="form-control form-control-sm">
                </div>

                <div class="col-12 col-md-2">
                  <label for="dniInput" class="form-label small fw-bold mb-1">DNI</label>
                  <input type="text" id="dniInput" name="dni" placeholder="Sin puntos" th:value="${dni}" class="form-control form-control-sm">
                </div>

                <div class="col-12 col-md-2">
                  <label for="tipoFichadaInput" class="form-label small fw-bold mb-1">Movimiento</label>
                  <select id="tipoFichadaInput" name="tipoFichada" class="form-select form-select-sm">
                    <option value="">Ambos</option>
                    <option value="ENTRADA" th:selected="${tipoFichada == 'ENTRADA'}">Entrada</option>
                    <option value="SALIDA" th:selected="${tipoFichada == 'SALIDA'}">Salida</option>
                  </select>
                </div>

                <div class="col-12 col-md-2">
                  <label for="fechaDesdeInput" class="form-label  small fw-bold mb-1">Desde</label>
                  <input type="date" id="fechaDesdeInput" name="fechaDesde" th:value="${fechaDesde}" class="form-control form-control-sm">
                </div>

                <div class="col-12 col-md-2">
                  <label for="fechaHastaInput" class="form-label  small fw-bold mb-1">Hasta</label>
                  <input type="date" id="fechaHastaInput" name="fechaHasta" th:value="${fechaHasta}" class="form-control form-control-sm">
                </div>

                <div class="col-12 mt-3 d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-sm btn-outline-secondary fw-bold" onclick="location.reload();" title="Recargar la tabla">
                    <i class="bi bi-arrow-clockwise me-1"></i> Recargar
                  </button>

                  <a th:href="@{/fichada/listarFichadas}" class="btn btn-sm btn-outline-danger fw-bold" title="Borrar todos los filtros">
                    <i class="bi bi-eraser me-1"></i> Limpiar
                  </a>

                  <button type="submit" class="btn btn-sm btn-primary fw-bold px-4">
                    <i class="bi bi-funnel me-1"></i> Filtrar
                  </button>
                </div>

              </div>
            </form>
          </div>

          <div class="table-responsive border shadow-sm">
            <table id="tabla-fichadas" class="table table-striped table-hover align-middle mb-0">
              <thead>
              <tr>
                <th class="ps-3">AGENTE</th>
                <th class="text-center">DNI</th>
                <th class="text-center">TIPO</th>
                <th class="text-center">FECHA Y HORA</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="fichada : ${fichadas.content}">
                <td class="ps-3 fw-semibold text-truncate" style="max-width: 250px;"
                    th:text="${fichada.agente.apellido} + ', ' + ${fichada.agente.nombre}"></td>

                <td class="text-center text-muted" th:text="${fichada.agente.dni}"></td>

                <td class="text-center">
                  <span th:if="${fichada.tipoFichada.identificador.toString() == 'E'}" class="badge bg-info-subtle text-info border border-info-subtle">
                      <i class="bi bi-box-arrow-in-right me-1"></i> ENTRADA
                  </span>
                  <span th:if="${fichada.tipoFichada.identificador.toString() == 'S'}" class="badge bg-warning-subtle text-warning border border-warning-subtle">
                      <i class="bi bi-box-arrow-right me-1"></i> SALIDA
                  </span>
                </td>

                <td class="text-center">
                  <i class="bi bi-clock text-secondary me-1"></i>
                  <span th:text="${#temporals.format(fichada.hora, 'dd/MM/yyyy HH:mm')}"></span>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(fichadas.content)}">
                <td colspan="4" class="text-center text-muted py-4 fst-italic">
                  No se encontraron fichadas con los filtros aplicados.
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3" th:if="${fichadas.totalPages > 0}">

            <div class="text-muted small">
              Mostrando página <span class="fw-bold" th:text="${fichadas.number + 1}"></span> de <span class="fw-bold" th:text="${fichadas.totalPages}"></span>
            </div>

            <nav aria-label="Navegación de páginas">
              <ul class="pagination pagination-sm mb-0">

                <li class="page-item" th:classappend="${!fichadas.hasPrevious()} ? 'disabled'">
                  <a class="page-link" th:href="@{/fichada/listarFichadas(page=${fichadas.number - 1}, nombre=${nombre}, apellido=${apellido}, dni=${dni}, tipoFichada=${tipoFichada}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}">
                    Anterior
                  </a>
                </li>

                <li class="page-item" th:classappend="${!fichadas.hasNext()} ? 'disabled'">
                  <a class="page-link" th:href="@{/fichada/listarFichadas(page=${fichadas.number + 1}, nombre=${nombre}, apellido=${apellido}, dni=${dni}, tipoFichada=${tipoFichada}, fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}">
                    Siguiente
                  </a>
                </li>

              </ul>
            </nav>
          </div>

        </div>
      </div>
    </main>
  </body>
</html>
