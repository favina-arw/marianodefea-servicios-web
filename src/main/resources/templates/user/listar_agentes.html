<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">

<head>
  <title>Listado de Agentes</title>
</head>

<body>
<main layout:fragment="dashboard_content">

  <!-- Action Cards -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-xl-3">
      <div th:replace="~{fragments/components :: action_card(
                url='/agentes/crearAgente',
                iconClass='bi bi-person-plus-fill',
                title='Agregar Agente',
                subtitle='Dar de alta agente con cargo')}">
      </div>
    </div>

    <div class="col-12 col-sm-6 col-xl-3">
      <div th:replace="~{fragments/components :: action_card(
                url='/admin/asignaciones/crear',
                iconClass='bi bi-briefcase-fill',
                title='Asignar Cargo',
                subtitle='Vincular agente a cargo')}">
      </div>
    </div>
  </div>

  <!-- Main Card Estandarizada -->
  <div class="card shadow-sm">

    <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
      <h6 class="mb-0 fw-bold text-body text-uppercase">
        Listado de Agentes
      </h6>
      <hr class="mt-3 mb-0 text-muted opacity-25">
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0" style="font-size: 0.9rem;">
          <thead>
          <tr>
            <th class="ps-3 text-start">NOMBRE</th>
            <th class="text-center">APELLIDO</th>
            <th class="text-center">DNI</th>
            <th class="text-center">CUIT</th>
            <th class="text-center">CARGOS</th>
            <th class="text-center">ESTADO</th>
            <th class="text-center pe-3">ACCIONES</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="agente : ${agentes}">
            <td class="ps-3 text-start fw-semibold" th:text="${agente.nombre.toUpperCase()}"></td>
            <td class="text-center fw-semibold" th:text="${agente.apellido.toUpperCase()}"></td>
            <td class="text-center text-muted" th:text="${agente.dni}"></td>
            <td class="text-center text-muted" th:text="${agente.cuil}"></td>

            <!-- BOTÓN DISPARADOR DEL MODAL -->
            <td class="text-center">
              <button type="button"
                      class="btn btn-sm btn-outline-secondary rounded-pill fw-bold"
                      data-bs-toggle="modal"
                      th:data-bs-target="'#modalCargos_' + ${agente.id}"
                      th:title="'Ver cargos de ' + ${agente.nombre}">
                <i class="bi bi-briefcase me-1"></i>
                <span th:text="${agente.getCargosAsignados().size()}"></span>
              </button>
            </td>

            <td class="text-center">
              <span th:if="${agente.isActivo()}" class="badge bg-success">Activo</span>
              <span th:unless="${agente.isActivo()}" class="badge bg-danger">Inactivo</span>
            </td>
            <td class="text-center pe-3">
              <div class="d-flex justify-content-center align-items-center gap-1">
                <!-- Botón INFO -->
                <a th:href="@{/agentes/ver/{id}(id=${agente.id})}"
                   class="btn btn-sm btn-info text-white"
                   data-bs-toggle="tooltip" title="Ver detalle del agente">
                  <i class="bi bi-eye-fill"></i>
                </a>
                <!-- Botón ACTION -->
                <a th:href="@{/agentes/editar/{id}(id=${agente.id})}"
                   class="btn btn-sm btn-primary"
                   data-bs-toggle="tooltip" title="Editar datos">
                  <i class="bi bi-pencil-square"></i>
                </a>
                <!-- Dar de Baja -->
                <a sec:authorize="hasAnyRole('ADMIN', 'DIRECTIVO')"
                   th:if="${agente.isActivo()}"
                   th:href="@{/agentes/baja/{id}(id=${agente.id})}"
                   class="btn btn-sm btn-danger"
                   data-bs-toggle="tooltip" title="Dar de baja">
                  <i class="bi bi-person-x-fill"></i>
                </a>
                <!-- Dar de Alta -->
                <a sec:authorize="hasAnyRole('ADMIN', 'DIRECTIVO')"
                   th:unless="${agente.isActivo()}"
                   th:href="@{/agentes/alta/{id}(id=${agente.id})}"
                   class="btn btn-sm btn-success"
                   data-bs-toggle="tooltip" title="Dar de alta">
                  <i class="bi bi-person-check-fill"></i>
                </a>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ==========================================
       MODALES DE CARGOS (Fuera de la tarjeta)
       ========================================== -->
  <div th:each="agente : ${agentes}">
    <div class="modal fade" th:id="'modalCargos_' + ${agente.id}" tabindex="-1" aria-labelledby="modalCargosLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">

          <div class="modal-header">
            <h5 class="modal-title fw-bold text-uppercase" id="modalCargosLabel">
              <i class="bi bi-person-badge me-2 text-primary"></i>
              Cargos de <span class="text-primary" th:text="${agente.nombre + ' ' + agente.apellido}"></span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body">
            <div class="table-responsive">
              <table class="table table-striped align-middle mb-0">
                <thead>
                <tr>
                  <th class="ps-3">Cargo Asignado</th>
                  <th class="text-center">Hora de Entrada</th>
                  <th class="text-center">Hora de Salida</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cargoAsignado : ${agente.cargosAsignados}">
                  <td class="ps-3 fw-semibold" th:text="${cargoAsignado.nombreCargo}"></td>
                  <td class="text-center">
                    <span class="badge bg-light text-dark border border-secondary" th:text="${cargoAsignado.horaEntrada}"></span>
                  </td>
                  <td class="text-center">
                    <span class="badge bg-light text-dark border border-secondary" th:text="${cargoAsignado.horaSalida}"></span>
                  </td>
                </tr>
                <!-- Mensaje vacío si el pibe no tiene cargos -->
                <tr th:if="${#lists.isEmpty(agente.cargosAsignados)}">
                  <td colspan="3" class="text-center text-muted fst-italic py-4">
                    <i class="bi bi-inbox fs-4 d-block mb-2 text-secondary"></i>
                    Este agente no posee cargos asignados actualmente.
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="modal-footer border-top-0">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
            <!-- Acá el día de mañana podés meter un botón tipo "Asignar nuevo cargo a este agente" -->
          </div>

        </div>
      </div>
    </div>
  </div>

</main>
</body>
</html>
