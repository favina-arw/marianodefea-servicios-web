<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">

<head>
  <title>Tablón</title>
</head>
<body>

<!-- Llenamos el hueco de dashboard.html -->
<main layout:fragment="dashboard_content">

  <div class="card shadow-sm border-0 rounded-3 mb-4">
    <div class="card-body">
      <h5 class="card-title text-primary">Próximamente... tablón.</h5>
      <hr>
      <p class="card-text">
        (Certificados/articulos, "Tomaron horas" y "Horas Sin Cubrir")
      </p>
    </div>
  </div>

  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
      <div class="row">
        <div class="col-12 col-md-8 mx-auto"> <div class="mb-3">
          <label for="id_nombre" class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="id_nombre" placeholder="Ej: Mariano de Fea" required>
          <div class="form-text">@ Ingrese el nombre legal tal como figura en el DNI.</div>
        </div>

          <div class="mb-3">
            <label for="id_legajo" class="form-label fw-semibold">Número de Legajo <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="id_legajo" required>
          </div>

          <div class="mb-3">


            <label for="id_fecha_nacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
            <input type="date" class="form-control" id="id_fecha_nacimiento">
          </div>

          <div class="mb-4"> <label for="id_documento" class="form-label fw-semibold">Documentación Adjunta</label>
            <input type="file" class="form-control" id="id_documento" accept=".pdf,.jpg,.png">
            <div class="form-text">Formatos permitidos: PDF, JPG o PNG. Tamaño máximo 5MB.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="#" class="btn btn-outline-secondary">Cancelar</a>
          </div>

        </div>
      </div>
    </div>
  </div>

</main>

</body>
</html>
