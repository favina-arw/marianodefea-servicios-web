<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <meta charset="UTF-8">
    <title>Crear Agente</title>
</head>
<body>
<main layout:fragment="dashboard_content">
    <div class="card shadow-sm justify-content-center mb-4">
        <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
            <h6 class="mb-0 fw-bold text-body text-uppercase">
                <i class="bi bi-person-plus me-2"></i>Crear Nuevo Agente
            </h6>
            <hr class="mt-3 mb-0 text-muted opacity-25">
        </div>

        <div class="card-body">
            <!-- El formulario limpio, sin alertas arriba, vinculado al DTO -->
            <form th:action="@{/agentes/crearAgente}" th:object="${agenteDTO}" method="POST" class="row g-3" style="font-size: 0.85rem;">

                <div class="col-md-3">
                    <label class="form-label mb-1 text-muted fw-medium">DNI</label>
                    <input type="text" class="form-control form-control-sm" th:field="*{dni}" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label mb-1 text-muted fw-medium">CUIL/CUIT</label>
                    <input type="text" class="form-control form-control-sm" th:field="*{cuil}">
                </div>

                <div class="col-md-3">
                    <label class="form-label mb-1 text-muted fw-medium">Nombre/s</label>
                    <input type="text" class="form-control form-control-sm" th:field="*{nombre}" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label mb-1 text-muted fw-medium">Apellido/s</label>
                    <input type="text" class="form-control form-control-sm" th:field="*{apellido}" required>
                </div>

                <!-- Fila del Botón -->
                <div class="col-12 mt-4 d-flex justify-content-center">
                    <button type="submit" class="btn btn-success btn-sm fw-semibold px-4 py-2">
                        Guardar Agente
                    </button>
                </div>

            </form>
        </div>
    </div>
</main>
</body>
</html>
