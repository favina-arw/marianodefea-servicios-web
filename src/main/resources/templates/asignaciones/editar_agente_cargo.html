<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <meta charset="UTF-8">
    <title>Editar Horario del Cargo</title>
</head>
<body>

<main layout:fragment="dashboard_content">

    <div class="card shadow-sm">
        <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
            <h6 class="mb-0 fw-bold text-body text-uppercase">
                Editar Horario: <span class="text-primary" th:text="${cargoEdit.nombreCargo}">Cargo</span>
            </h6>
            <hr class="mt-3 mb-0 text-muted opacity-25">
        </div>

        <div class="card-body px-4 py-4">
            <!-- El action apunta al @PostMapping de tu controlador -->
            <form th:action="@{/admin/asignaciones/agenteCargo/editar}" th:object="${cargoEdit}" method="post">

                <!-- CLAVE: Campos ocultos para mantener los IDs durante el viaje al backend -->
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{agenteId}">

                <div class="row g-3">
                    <!-- Fecha de Alta -->
                    <div th:replace="~{fragments/form_inputs :: fecha('fechaAlta', 'Fecha de Alta', true, 'Fecha en la que se comienza a ejercer el cargo', 4)}"></div>

                    <!-- Hora de Inicio -->
                    <div th:replace="~{fragments/form_inputs :: hora('horaInicio', 'Hora de Entrada', true, 'Hora en la que inicia actividades', 4)}"></div>

                    <!-- Hora de Fin -->
                    <div th:replace="~{fragments/form_inputs :: hora('horaFin', 'Hora de Salida', true, 'Hora en la que finaliza actividades', 4)}"></div>
                </div>

                <hr class="mt-4 mb-3 text-muted opacity-25">

                <!-- Botonera -->
                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" class="btn btn-success btn-sm">
                        Guardar Cambios
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Botón para volver al listado -->
    <div class="card mt-5">
        <div class="card-body d-flex justify-content-center">
            <a th:href="@{/agentes/}" class="btn btn-sm btn-primary">
                Volver
            </a>
        </div>
    </div>
</main>

</body>
</html>
