<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <title>Vincular Agente y Cargo</title>
</head>
<body>
<main layout:fragment="dashboard_content">

    <div class="card shadow-sm">

        <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
            <h6 class="mb-0 fw-bold text-body text-uppercase">
                Vincular Agente a Cargo
            </h6>
            <hr class="mt-3 mb-0 text-muted opacity-25">
        </div>

        <!-- === INICIO ALERTA DE ERROR === -->
        <div th:replace="~{fragments/alertas :: alertaErrorFormulario(${errorExt})}"></div>
        <!-- === FIN ALERTA DE ERROR === -->

        <div class="card-body">

            <form th:action="@{/admin/asignaciones/guardar}" th:object="${asignacionDTO}" method="post">

                <div class="row">
                    <div class="col-md-6">
                        <label class="font-weight-bold">Seleccionar Agente <span class="text-danger">*</span></label>
                        <select th:field="*{agenteId}" class="form-control" required>
                            <option value="" class="text-muted">Elegí un agente de la lista...</option>
                            <option th:each="agente : ${agentes}"
                                    th:value="${agente.id}"
                                    th:text="${agente.apellido + ', ' + agente.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Seleccionar Cargo Disponible <span class="text-danger">*</span></label>
                        <select th:field="*{cargoId}" class="form-control" required>
                            <option value="" class="text-muted">Elegí un cargo...</option>
                            <!-- Esto asume que tenés los Cargos en el modelo. Ajustá el th:text si necesitás mostrar el curso -->
                            <option th:each="cargo : ${cargos}"
                                    th:value="${cargo.id}"
                                    th:text="${cargo.cargoTipo.nombre}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-md-4 form-group">
                        <label class="font-weight-bold">Fecha de Alta / Toma de Posesión <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{fechaAlta}" class="form-control" required>
                    </div>
                    <div class="col-md-4 form-group">
                        <label class="font-weight-bold">Hora de Inicio <span class="text-danger">*</span></label>
                        <input type="time" th:field="*{horaInicio}" class="form-control" required>
                    </div>
                    <div class="col-md-4 form-group">
                        <label class="font-weight-bold">Hora de Fin <span class="text-danger">*</span></label>
                        <input type="time" th:field="*{horaFin}" class="form-control" required>
                    </div>
                </div>

                <div class="col-lg-12 d-flex justify-content-center">
                    <button type="submit" class="btn btn-success btn-block mt-4">
                        Confirmar Asignación
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- Botón para volver al listado -->
    <div class="card mt-5">
        <div class="card-body d-flex justify-content-center">
            <a th:href="@{/agentes/}" class="btn btn-sm btn-primary">
                Volver
            </a>
        </div>
    </div>

</main>
</body>
</html>
