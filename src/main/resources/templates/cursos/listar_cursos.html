<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <meta charset="UTF-8">
    <title>Cursos</title>
</head>
<body>
<main layout:fragment="dashboard_content">

    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
            <div th:replace="~{fragments/components :: action_card(
            url='/admin/cursos/crear',
            iconClass='bi bi-plus-lg me-1',
            title='Nuevo Curso',
            subtitle='Crear nuevo curso')}">
            </div>
        </div>
    </div>

    <div class="card shadow-sm justify-content-center">
        <div class="card-body">
            <h4 class="card-title mb-3">Listado de Cursos</h4>
            <hr>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0" style="font-size: 0.9rem;">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>CURSO (AÑO Y DIVISIÓN)</th>
                        <th>TURNO</th>
                        <th>CICLO</th>
                        <th class="text-center">ESTADO</th>
                        <th class="text-center pe-3">ACCIONES</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="curso : ${cursos}">
                        <td class="ps-3 text-muted" th:text="${curso.id}"></td>

                        <!-- Usamos el método de ayuda que creamos en la entidad para formatear el nombre -->
                        <td class="fw-bold" th:text="${curso.getNombreCompleto()}"></td>

                        <td th:text="${curso.turno}"></td>
                        <td th:text="${curso.ciclo}"></td>

                        <td class="text-center">
                            <span th:if="${curso.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${curso.activo}" class="badge bg-danger">Inactivo</span>
                        </td>

                        <td class="text-center pe-3">
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/cursos/editar/{id}(id=${curso.id})}"
                                   class="btn btn-sm btn-primary" data-bs-toggle="tooltip" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <a th:if="${curso.activo}" th:href="@{/cursos/baja/{id}(id=${curso.id})}"
                                   class="btn btn-sm btn-danger" data-bs-toggle="tooltip" title="Dar de baja">
                                    <i class="bi bi-dash-circle"></i>
                                </a>

                                <a th:unless="${curso.activo}" th:href="@{/cursos/alta/{id}(id=${curso.id})}"
                                   class="btn btn-sm btn-success" data-bs-toggle="tooltip" title="Activar">
                                    <i class="bi bi-check-circle"></i>
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(cursos)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No hay cursos registrados en el sistema.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
