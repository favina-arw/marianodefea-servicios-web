<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <title>Nuevo Cargo Estructural</title>
</head>
<body>
<main layout:fragment="dashboard_content">

    <div class="card shadow-sm border-0 rounded">

        <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
            <h6 class="mb-0 fw-bold text-body text-uppercase">
                Nuevo Cargo Estructural
            </h6>
            <hr class="mt-3 mb-0 text-muted opacity-25">
        </div>

        <div class="card-body">

            <form th:action="@{/admin/cargos/guardar}" th:object="${cargo}" method="post">

                <div class="row">
                    <div class="col-md-12 form-group mb-3">
                        <label class="font-weight-bold">Tipo de Cargo <span class="text-danger">*</span></label>
                        <select class="form-control" th:field="*{cargoTipo}" required>
                            <option value="">Seleccione el rol...</option>
                            <option th:each="tipo : ${tipos}"
                                    th:value="${tipo.id}"
                                    th:text="${tipo.nombre}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Curso Asignado</label>
                        <select class="form-control" th:field="*{curso}">
                            <option value="">Ninguno / No aplica</option>
                            <option th:each="c : ${cursos}"
                                    th:value="${c.id}"
                                    th:text="${c.getNombreCompleto()}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 form-group">
                        <label class="font-weight-bold">Materia Asignada</label>
                        <select class="form-control" th:field="*{materia}">
                            <option value="">Ninguna / No aplica</option>
                            <option th:each="m : ${materias}"
                                    th:value="${m.id}"
                                    th:text="${m.nombre + ' (' + m.ciclo + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="col-lg-12 d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary btn-block mt-4">
                        Guardar Cargo
                    </button>
                </div>

            </form>

        </div>
    </div>

</main>
</body>
</html>
