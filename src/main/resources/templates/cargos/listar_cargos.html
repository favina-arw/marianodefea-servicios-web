<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard}">
<head>
    <title>Cargos Estructurales</title>
</head>
<body>
<main layout:fragment="dashboard_content">

    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
            <div th:replace="~{fragments/components :: action_card(
            url='/admin/cargos/crear',
            iconClass='bi bi-plus-lg me-1',
            title='Nuevo Cargo',
            subtitle='Crear nuevo cargo')}">
            </div>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
            <div th:replace="~{fragments/components :: action_card(
            url='/admin/asignaciones/crear',
            iconClass='bi bi-plus-lg me-1',
            title='Asignar Cargo',
            subtitle='Asignar cargo a agente')}">
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
            <h6 class="mb-0 fw-bold text-body text-uppercase">
                Listado de cargos
            </h6>
            <hr class="mt-3 mb-0 text-muted opacity-25">
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0" style="font-size: 0.9rem;">
                    <thead>
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>TIPO DE CARGO</th>
                        <th>CURSO ASIGNADO</th>
                        <th>MATERIA ASIGNADA</th>
                        <th class="text-center">ESTADO</th>
                        <th class="text-center pe-3">ACCIONES</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cargo : ${cargos}">
                        <td class="ps-3 text-muted" th:text="${cargo.id}"></td>

                        <!-- El tipo de cargo nunca es nulo, así que lo mostramos directo -->
                        <td class="fw-semibold" th:text="${cargo.cargoTipo.nombre}"></td>

                        <!-- Curso y Materia pueden ser nulos, usamos el operador ternario de Thymeleaf -->
                        <td th:text="${cargo.curso != null ? cargo.curso.getNombreCompleto() : '-'}"></td>
                        <td th:text="${cargo.materia != null ? cargo.materia.nombre : '-'}"></td>

                        <td class="text-center">
                            <span th:if="${cargo.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${cargo.activo}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td class="text-center pe-3">
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/admin/cargos/editar/{id}(id=${cargo.id})}" class="btn btn-sm btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:if="${cargo.activo}" th:href="@{/admin/cargos/baja/{id}(id=${cargo.id})}" class="btn btn-sm btn-danger">
                                    <i class="bi bi-dash-circle"></i>
                                </a>
                                <a th:unless="${cargo.activo}" th:href="@{/admin/cargos/alta/{id}(id=${cargo.id})}" class="btn btn-sm btn-success">
                                    <i class="bi bi-check-circle"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
